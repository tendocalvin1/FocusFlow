services:
  web:
    build: .
    command: gunicorn Backend.wsgi:application --bind 0.0.0.0:8000

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

  db:
    image: postgres:17
    
    
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow_user -d focusflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: